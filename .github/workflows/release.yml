name: Package Pipeline plugins
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/package-plugins.py
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-review-packages
          path: dist/*.zip
          if-no-files-found: error
