<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrialAgents Pipeline</title>
<style>*{box-sizing:border-box}body{margin:0;color:#172638;background:#f4f6fa;font:15px/1.5 Inter,system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#122c24;color:white;padding:12px 18px}header strong{font-size:17px}button,select,input{font:inherit}button,select{border:1px solid #cbd5dc;border-radius:7px;background:white;color:#172638;padding:5px 10px;cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent,#14644e)}button:disabled{opacity:.55;cursor:default}header button{background:transparent;border-color:#6d847a;color:white}nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px 0}nav button[aria-current]{background:var(--accent,#14644e);color:white}main{padding:16px;max-width:1670px;margin:auto}section{background:white;border:1px solid #dce3e9;padding:16px;border-radius:12px}h1{font-size:21px;margin:0 0 12px}p{margin:8px 0}.bound-table{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:9px;border-bottom:1px solid #dce3e9}th{text-transform:capitalize;color:#536478}small{color:#536478}form{display:flex;align-items:end;gap:12px;flex-wrap:wrap}label{display:grid;gap:5px}input{max-width:100%;padding:5px;border:1px solid #cbd5dc;border-radius:5px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}#status:not(:empty){padding:8px 16px;color:#594823}@media(max-width:500px){header,main{padding:10px}nav{padding:10px 10px 0}section{padding:10px}button{min-height:32px}}</style></head>
<body><header><strong>TrialAgents Pipeline</strong><button id="external" hidden>Open TrialAgents app ↗</button></header><nav aria-label="Workspace tabs"></nav><main aria-busy="true">Opening workspace…</main><p id="status" role="status"></p></body></html>
